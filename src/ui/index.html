<!DOCTYPE html>

<head>

<title>AI Growth · 面板</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="hud">

  <header class="topbar">

      <span class="brand-mark" aria-hidden="true"></span>
      <span class="brand-text">AI&nbsp;GROWTH</span>

    <nav class="tabs" id="tabs">
      <button class="tab is-active" data-page="today">面板</button>
      <button class="tab" data-page="goals">主线</button>
